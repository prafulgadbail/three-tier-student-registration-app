apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: backend-hpa
  namespace: student-app

spec:
  # Scale the backend Deployment based on CPU utilization
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend

  # Minimum and maximum backend pod count
  minReplicas: 2
  maxReplicas: 5

  # Scale when average CPU utilization crosses 70%
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70